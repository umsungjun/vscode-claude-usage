<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Claude sparkle mark — transparent background, orange -->
  <g transform="translate(64, 64)" fill="#E8692A">
    <!-- 수직 페탈 -->
    <ellipse cx="0" cy="0" rx="13" ry="62"/>
    <!-- 수평 페탈 -->
    <ellipse cx="0" cy="0" rx="62" ry="13"/>
    <!-- 대각선 페탈 (45도) -->
    <ellipse cx="0" cy="0" rx="13" ry="62" transform="rotate(45)"/>
    <!-- 대각선 페탈 (-45도) -->
    <ellipse cx="0" cy="0" rx="13" ry="62" transform="rotate(-45)"/>
    <!-- 중앙 원 -->
    <circle cx="0" cy="0" r="18" fill="#E8692A"/>
  </g>
</svg>
