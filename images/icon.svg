<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A24C"/>
      <stop offset="50%" style="stop-color:#E8943A"/>
      <stop offset="100%" style="stop-color:#D4782A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- Claude sparkle mark — centered -->
  <g transform="translate(64, 64)" fill="white">
    <!-- Main vertical petal -->
    <ellipse cx="0" cy="0" rx="6" ry="28"/>
    <!-- Horizontal petal -->
    <ellipse cx="0" cy="0" rx="28" ry="6"/>
    <!-- Diagonal petal (top-right to bottom-left) -->
    <ellipse cx="0" cy="0" rx="6" ry="28" transform="rotate(45)"/>
    <!-- Diagonal petal (top-left to bottom-right) -->
    <ellipse cx="0" cy="0" rx="6" ry="28" transform="rotate(-45)"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="white"/>
  </g>
</svg>
