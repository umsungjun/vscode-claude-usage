<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8943A"/>
      <stop offset="100%" style="stop-color:#C96A00"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="128" height="128" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Claude "C" watermark (background layer) -->
  <text
    x="64" y="105"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="110"
    font-weight="bold"
    text-anchor="middle"
    fill="rgba(0,0,0,0.13)"
    clip-path="url(#rounded)"
  >C</text>

  <!-- Eye icon (Bootstrap Icons eye, scaled 5x, centered at 64,64) -->
  <!-- Original viewBox 0 0 16 16 → scale(5) → 80x80, translate to center -->
  <g transform="translate(24, 24) scale(5)" fill="white">
